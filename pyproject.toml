[project]
name = "komga-mcp"
version = "0.2.0"
description = "MCP server for Komga's REST API"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.0.0", "httpx>=0.27.0"]

[project.scripts]
komga-mcp = "komga_mcp:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: hits a real Komga instance (needs KOMGA_URL/KOMGA_API_KEY)"]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
